
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PlayZone | Browser Games</title>
  <meta name="description" content="Play free browser games on PlayZone.">

  <style>
    :root {
      --bg: #0b1020;
      --panel: #151d32;
      --panel-light: #202b45;
      --text: #f4f7ff;
      --muted: #a7b2cc;
      --accent: #7c5cff;
      --border: #2b3855;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      padding: 24px 6%;
      background: #10182b;
      border-bottom: 1px solid var(--border);
    }

    .topbar {
      max-width: 1400px;
      margin: auto;
    }

    .logo {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: -1px;
    }

    .logo span { color: var(--accent); }

    .tagline {
      color: var(--muted);
      margin-top: 6px;
      font-size: 14px;
    }

    main {
      max-width: 1400px;
      margin: auto;
      padding: 30px 6%;
    }

    .hero { margin-bottom: 26px; }

    .hero h1 {
      font-size: clamp(30px, 5vw, 48px);
      margin: 0 0 10px;
    }

    .hero p {
      color: var(--muted);
      line-height: 1.6;
    }

    .search {
      width: 100%;
      padding: 15px 17px;
      margin: 16px 0;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 16px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }

    .filter {
      background: var(--panel);
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: bold;
    }

    .filter.active,
    .filter:hover {
      background: var(--accent);
      color: white;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin: 30px 0 18px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 23px;
    }

    .section-title span {
      color: var(--muted);
      font-size: 13px;
    }

    .game-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    .game-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      overflow: hidden;
      transition: transform .18s, border-color .18s;
    }

    .game-card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .game-image {
      width: 100%;
      height: 155px;
      object-fit: cover;
      display: block;
      background: var(--panel-light);
    }

    .game-info { padding: 15px; }

    .game-info h3 {
      font-size: 17px;
      margin: 0 0 8px;
    }

    .category-label {
      display: inline-block;
      font-size: 12px;
      color: #c9c0ff;
      background: #30265c;
      padding: 5px 9px;
      border-radius: 999px;
      margin-bottom: 14px;
      text-transform: capitalize;
    }

    .game-actions {
      display: flex;
      gap: 8px;
    }

    .play-button,
    .favorite-button {
      border: 0;
      padding: 11px 10px;
      border-radius: 9px;
      cursor: pointer;
      font-weight: bold;
    }

    .play-button {
      flex: 1;
      color: white;
      background: var(--accent);
    }

    .favorite-button {
      background: var(--panel-light);
      color: white;
      min-width: 44px;
      font-size: 17px;
    }

    .favorite-button.is-favorite { color: #ff668a; }

    .empty {
      color: var(--muted);
      padding: 25px 0;
      grid-column: 1 / -1;
    }

    #player-section {
      display: none;
      margin: 35px 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 18px;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 15px;
    }

    .player-header h2 { margin: 0; }

    .player-buttons {
      display: flex;
      gap: 8px;
    }

    .player-buttons button {
      border: 0;
      border-radius: 8px;
      padding: 10px 13px;
      background: var(--panel-light);
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    #game-frame {
      width: 100%;
      height: min(72vh, 750px);
      min-height: 400px;
      display: block;
      background: #000;
      border: 0;
      border-radius: 10px;
    }

    footer {
      padding: 30px 6%;
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 600px) {
      header { padding: 20px 5%; }
      main { padding: 24px 5%; }

      .game-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .game-image { height: 115px; }
      .game-info { padding: 11px; }
      .game-info h3 { font-size: 15px; }
      .play-button { font-size: 12px; }
      .favorite-button { min-width: 36px; }
      #game-frame { min-height: 330px; }
    }

    @media (max-width: 370px) {
      .game-grid { grid-template-columns: 1fr; }
      .game-image { height: 170px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="topbar">
      <div class="logo">Play<span>Zone</span></div>
      <div class="tagline">Your next favorite game starts here.</div>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Welcome to PlayZone</h1>
      <p>A home for browser games, all in one place.</p>
    </section>

    <input
      id="search"
      class="search"
      type="search"
      placeholder="Search games..."
      aria-label="Search games"
    >

    <nav class="filters" aria-label="Game categories">
      <button class="filter active" data-filter="all">All Games</button>
      <button class="filter" data-filter="arcade">Arcade</button>
      <button class="filter" data-filter="action">Action</button>
      <button class="filter" data-filter="sports">Sports</button>
      <button class="filter" data-filter="simulator">Simulator</button>
      <button class="filter" data-filter="clicker">Clicker</button>
      <button class="filter" data-filter="favorites">Favorites ♥</button>
    </nav>

    <section id="player-section">
      <div class="player-header">
        <h2 id="player-title">Now Playing</h2>
        <div class="player-buttons">
          <button id="fullscreen-button">Fullscreen</button>
          <button id="close-button">Close Game ✕</button>
        </div>
      </div>

      <iframe
        id="game-frame"
        title="PlayZone game player"
        allow="fullscreen; autoplay; gamepad"
        allowfullscreen
      ></iframe>
    </section>

    <section>
      <div class="section-title">
        <h2 id="grid-heading">All Games</h2>
        <span id="game-count"></span>
      </div>
      <div class="game-grid" id="game-grid"></div>
    </section>

    <section id="recent-section" hidden>
      <div class="section-title">
        <h2>Recently Played</h2>
      </div>
      <div class="game-grid" id="recent-grid"></div>
    </section>
  </main>

  <footer>PlayZone — Find a game, jump in, and have fun.</footer>

  <script>
    const games = [
      {
        id: "amoeba",
        title: "Amoeba Online",
        category: "arcade",
        image: "images/amoeba.jpg",
        url: "https://idev.games/embed/amoeba-online"
      },
      {
        id: "ragdoll",
        title: "Ragdoll Sandbox",
        category: "action",
        image: "images/ragdoll.jpg",
        url: "https://idev.games/embed/ragdoll---sandbox-physics-game"
      },
      {
        id: "mma",
        title: "Undisputed MMA",
        category: "sports",
        image: "images/mma.jpg",
        url: "https://idev.games/embed/undisputed-mma"
      },
      {
        id: "helix",
        title: "Helix Jump",
        category: "arcade",
        image: "images/helix.jpg",
        url: "https://idev.games/embed/helix-jump"
      },
      {
        id: "bitcoin",
        title: "Bitcoin Wallet Simulator",
        category: "simulator",
        image: "images/bitcoin.jpg",
        url: "https://idev.games/embed/bitcoin-wallet-simulator"
      },
      {
        id: "gem",
        title: "Gem Clicker",
        category: "clicker",
        image: "images/gem.jpg",
        url: "https://idev.games/embed/gem-clicker"
      },
      {
        id: "subway",
        title: "Subway Surfers",
        category: "arcade",
        image: "images/subway.jpg",
        url: "https://www.madkidgames.com/full/subway-surfers"
      },
      {
        id: "bowmasters",
        title: "Bowmasters",
        category: "action",
        image: "images/bowmasters.jpg",
        url: "https://www.madkidgames.com/full/bowmasters-archery-shooting"
      },
      {
        id: "cookie",
        title: "Cookie Clicker",
        category: "clicker",
        image: "images/cookie.jpg",
        url: "cookie-clicker/index.html"
      },
      {
        id: "geometry",
        title: "Geometry Dash Lite",
        category: "arcade",
        image: "images/geometry-dash.jpg",
        url: "geometry-dash.html"
      },
      {
        id: "rocket",
        title: "Rocket Goal.io",
        category: "sports",
        image: "images/rocket-goal.jpg",
        url: "https://www.twoplayergames.org/embed/rocket-goal-io"
      },
      {
        id: "minecraft",
        title: "Minecraft",
        category: "arcade",
        image: "images/mclogo.png",
        url: "minecraft.html"
      },
      {
        id: "holeio",
        title: "Hole.io",
        category: "arcade",
        image: "images/holeio.png",
        url: "https://www.gameflare.com/embed/holeio/"
      }
    ];

    const FAVORITES_KEY = "playzone_favorites_v1";
    const HISTORY_KEY = "playzone_history_v1";

    let activeFilter = "all";
    let searchTerm = "";

    function readStorage(key) {
      try {
        const value = JSON.parse(localStorage.getItem(key) || "[]");
        return Array.isArray(value) ? value : [];
      } catch {
        return [];
      }
    }

    function writeStorage(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch (error) {
        console.warn("Could not save PlayZone data.", error);
      }
    }

    function getFavorites() {
      return readStorage(FAVORITES_KEY);
    }

    function getHistory() {
      return readStorage(HISTORY_KEY);
    }

    function makeCard(game) {
      const card = document.createElement("article");
      card.className = "game-card";
      card.dataset.id = game.id;

      const image = document.createElement("img");
      image.className = "game-image";
      image.src = game.image;
      image.alt = game.title;
      image.loading = "lazy";

      image.onerror = () => {
        image.onerror = null;
        image.style.display = "none";
      };

      const info = document.createElement("div");
      info.className = "game-info";

      const title = document.createElement("h3");
      title.textContent = game.title;

      const category = document.createElement("span");
      category.className = "category-label";
      category.textContent = game.category;

      const actions = document.createElement("div");
      actions.className = "game-actions";

      const play = document.createElement("button");
      play.className = "play-button";
      play.dataset.action = "play";
      play.textContent = "Play Now";

      const favorite = document.createElement("button");
      favorite.className = "favorite-button";
      favorite.dataset.action = "favorite";
      favorite.setAttribute("aria-label", "Toggle favorite");

      const isFavorite = getFavorites().includes(game.id);
      favorite.textContent = isFavorite ? "♥" : "♡";
      favorite.classList.toggle("is-favorite", isFavorite);

      actions.append(play, favorite);
      info.append(title, category, actions);
      card.append(image, info);

      return card;
    }

    function renderGames() {
      const grid = document.getElementById("game-grid");
      const favorites = getFavorites();

      const filtered = games.filter(game => {
        const matchesSearch =
          game.title.toLowerCase().includes(searchTerm) ||
          game.category.toLowerCase().includes(searchTerm);

        const matchesFilter =
          activeFilter === "all" ||
          (activeFilter === "favorites" &&
            favorites.includes(game.id)) ||
          game.category === activeFilter;

        return matchesSearch && matchesFilter;
      });

      grid.replaceChildren();

      if (filtered.length === 0) {
        const empty = document.createElement("p");
        empty.className = "empty";
        empty.textContent =
          "No games found. Try another search or filter.";
        grid.append(empty);
      } else {
        filtered.forEach(game => grid.append(makeCard(game)));
      }

      document.getElementById("game-count").textContent =
        `${filtered.length} game${filtered.length === 1 ? "" : "s"}`;

      const headingNames = {
        all: "All Games",
        arcade: "Arcade Games",
        action: "Action Games",
        sports: "Sports Games",
        simulator: "Simulator Games",
        clicker: "Clicker Games",
        favorites: "Your Favorites"
      };

      document.getElementById("grid-heading").textContent =
        headingNames[activeFilter] || "Games";
    }

    function renderRecent() {
      const section = document.getElementById("recent-section");
      const grid = document.getElementById("recent-grid");

      const recentGames = getHistory()
        .map(id => games.find(game => game.id === id))
        .filter(Boolean)
        .slice(0, 4);

      grid.replaceChildren();
      recentGames.forEach(game => grid.append(makeCard(game)));
      section.hidden = recentGames.length === 0;
    }

    function playGame(game) {
      if (!game) return;

      const player = document.getElementById("player-section");
      const frame = document.getElementById("game-frame");

      document.getElementById("player-title").textContent = game.title;
      player.style.display = "block";

      if (frame.dataset.currentUrl !== game.url) {
        frame.src = game.url;
        frame.dataset.currentUrl = game.url;
      }

      const history = getHistory().filter(id => id !== game.id);
      history.unshift(game.id);
      writeStorage(HISTORY_KEY, history.slice(0, 20));

      renderRecent();
      player.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    function toggleFavorite(game) {
      if (!game) return;

      let favorites = getFavorites();

      if (favorites.includes(game.id)) {
        favorites = favorites.filter(id => id !== game.id);
      } else {
        favorites.push(game.id);
      }

      writeStorage(FAVORITES_KEY, favorites);
      renderGames();
      renderRecent();
    }

    document.addEventListener("click", event => {
      const filterButton = event.target.closest("[data-filter]");

      if (filterButton) {
        activeFilter = filterButton.dataset.filter;

        document.querySelectorAll(".filter").forEach(button => {
          button.classList.toggle("active", button === filterButton);
        });

        renderGames();
        return;
      }

      const actionButton = event.target.closest("[data-action]");
      if (!actionButton) return;

      const card = actionButton.closest(".game-card");
      if (!card) return;

      const game = games.find(item => item.id === card.dataset.id);
      if (!game) return;

      if (actionButton.dataset.action === "play") {
        playGame(game);
      } else if (actionButton.dataset.action === "favorite") {
        toggleFavorite(game);
      }
    });

    document.getElementById("search").addEventListener("input", event => {
      searchTerm = event.target.value.trim().toLowerCase();
      renderGames();
    });

    document.getElementById("close-button").addEventListener("click", () => {
      const frame = document.getElementById("game-frame");
      frame.src = "about:blank";
      frame.dataset.currentUrl = "";
      document.getElementById("player-section").style.display = "none";
    });

    document.getElementById("fullscreen-button").addEventListener("click", () => {
      const frame = document.getElementById("game-frame");

      if (frame.requestFullscreen) {
        frame.requestFullscreen();
      } else if (frame.webkitRequestFullscreen) {
        frame.webkitRequestFullscreen();
      }
    });

    renderGames();
    renderRecent();
  </script>
</body>
</html>
